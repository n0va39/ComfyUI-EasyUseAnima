name: Publish to Comfy registry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish a new Registry version or update existing Registry metadata."
        required: true
        default: "publish"
        type: choice
        options:
          - "publish"
          - "metadata"
      version:
        description: "Optional RELEASE.md version section to use. Defaults to pyproject.toml [project].version."
        required: false
        default: ""
      dry_run:
        description: "For metadata mode, print planned changes without applying them."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        if: ${{ inputs.mode == 'publish' }}
        uses: astral-sh/setup-uv@v5

      - name: Extract Registry changelog
        if: ${{ inputs.mode == 'publish' }}
        run: |
          python .github/scripts/extract_release_changelog.py \
            --version "${{ inputs.version }}" \
            --output "$RUNNER_TEMP/comfy-node-changelog.md"

      - name: Validate node package
        if: ${{ inputs.mode == 'publish' }}
        run: |
          uvx --from comfy-cli comfy --skip-prompt node validate

      - name: Publish Custom Node
        if: ${{ inputs.mode == 'publish' }}
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          uvx --from comfy-cli comfy --skip-prompt node publish \
            --token "$REGISTRY_ACCESS_TOKEN" \
            --changelog-file "$RUNNER_TEMP/comfy-node-changelog.md"

      - name: Sync existing Registry metadata
        if: ${{ inputs.mode == 'metadata' }}
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          python .github/scripts/sync_comfy_registry_metadata.py --dry-run "${{ inputs.dry_run }}"
