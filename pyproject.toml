[project]
name = "comfyui-easyuse-anima"
description = "Prompt editing, ANIMA prompt correction, NAIA prompt integration, LoRA preset management, wildcard expansion, AiO generation, and ANIMA/Spectrum workflow helpers for ComfyUI."
version = "1.1.5"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "googletrans-py==4.0.0",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/n0va39/ComfyUI-EasyUseAnima"
"Bug Tracker" = "https://github.com/n0va39/ComfyUI-EasyUseAnima/issues"

[tool.comfy]
PublisherId = "n0va39"
DisplayName = "ComfyUI EasyUse Anima"

[tool.ruff]
target-version = "py310"
extend-exclude = [".github", "tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
